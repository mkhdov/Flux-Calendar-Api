apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-frontend
  namespace: ${K8S_NAMESPACE}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flux-frontend
  template:
    metadata:
      labels:
        app: flux-frontend
    spec:
      containers:
        - name: flux-frontend
          image: ${FRONTEND_IMAGE}
          ports:
            - containerPort: ${FRONTEND_CONTAINER_PORT}
          readinessProbe:
            tcpSocket:
              port: ${FRONTEND_CONTAINER_PORT}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ${FRONTEND_CONTAINER_PORT}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flux-frontend
  namespace: ${K8S_NAMESPACE}
spec:
  selector:
    app: flux-frontend
  ports:
    - name: http
      port: 80
      targetPort: ${FRONTEND_CONTAINER_PORT}
