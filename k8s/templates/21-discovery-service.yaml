apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: ${K8S_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery-service
          image: ${DISCOVERY_IMAGE}
          ports:
            - containerPort: 8761
          env:
            - name: CONFIG_URL
              value: http://flux-config-server:8888
          envFrom:
            - configMapRef:
                name: flux-app-config
            - secretRef:
                name: flux-app-secrets
          startupProbe:
            tcpSocket:
              port: 8761
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: ${K8S_NAMESPACE}
spec:
  selector:
    app: discovery-service
  ports:
    - name: http
      port: 8761
      targetPort: 8761
