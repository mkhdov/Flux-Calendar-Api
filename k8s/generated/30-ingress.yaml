apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flux-ingress
  namespace: flux
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
spec:
  ingressClassName: nginx
  rules:
    - host: flux.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flux-frontend
                port:
                  number: 80
    - host: api.flux.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8083
