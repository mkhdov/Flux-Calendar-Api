apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-frontend
  namespace: flux
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flux-frontend
  template:
    metadata:
      labels:
        app: flux-frontend
    spec:
      containers:
        - name: flux-frontend
          image: test/front:1
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flux-frontend
  namespace: flux
spec:
  selector:
    app: flux-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
