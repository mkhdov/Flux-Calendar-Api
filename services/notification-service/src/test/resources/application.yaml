spring:
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:h2:mem:notification_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 25
    username: test@flux.local
    password: test

  redis:
    host: localhost
    port: 6379

management:
  health:
    mail:
      enabled: false
