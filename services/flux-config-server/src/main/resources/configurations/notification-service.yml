spring:
  datasource:
    url: ${NOTIFICATION_PGURL}
    username: ${NOTIFICATION_PGUSER}
    password: ${NOTIFICATION_PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-description: init
    baseline-version: 0
    url: ${NOTIFICATION_PGURL}
    user: ${NOTIFICATION_PGUSER}
    password: ${NOTIFICATION_PGPASSWORD}

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    database: ${REDIS_DATABASE:1}
    timeout: ${REDIS_TIMEOUT:2000ms}
    lettuce:
      pool:
        max-active: 30
        max-idle: 10
        min-idle: 3
        max-wait: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.info.headers: false
        spring.json.value.default.type: com.flux.notification_service.kafka.ReminderEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL}

server:
  port: ${NOTIFICATION_PORT:8084}
  tomcat:
    threads:
      max: 100
      min-spare: 10
    accept-count: 50
    connection-timeout: 5000

notification:
  scheduler:
    poll-interval: 30000
    batch-size: 100
  retry:
    max-attempts: 3
  dedup:
    ttl-hours: 24

user-management-service:
  url: ${USER_MANAGEMENT_SERVICE_URL:http://user-management-service:${USER_MANAGEMENT_PORT:8081}}

calendar-service:
  # Legacy fallback only (primary reminder rendering uses Kafka snapshots stored in DB)
  url: ${CALENDAR_SERVICE_URL:http://calendar-service:${CALENDARS_PORT:8082}}
