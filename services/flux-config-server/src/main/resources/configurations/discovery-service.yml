eureka:
  instance:
    hostname: ${DISCOVERY_HOSTNAME}
    prefer-ip-address: false
    instanceId: ${spring.application.name}:${random.value}
  client:
    register-with-eureka: false
    fetch-registry: false
    serviceUrl:
      defaultZone: ${EUREKA_SERVICE_URL}

server:
  port: ${DISCOVERY_PORT}

spring:
  application:
    name: ${DISCOVERY_APP_NAME}
