spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-management-service-swagger
          uri: lb://USER-MANAGEMENT-SERVICE
          predicates:
            - Path=/user-management/v3/api-docs/**, /user-management/swagger-ui/**, /user-management/swagger-ui.html
          filters:
            - StripPrefix=1
        - id: calendars-service-swagger
          uri: lb://CALENDARS-SERVICE
          predicates:
            - Path=/calendars/v3/api-docs/**, /calendars/swagger-ui/**, /calendars/swagger-ui.html
          filters:
            - StripPrefix=1
        - id: user-management-service
          uri: lb://USER-MANAGEMENT-SERVICE
          predicates:
            - Path=/users/**, /api/auth/**, /login, /api/users/login/**, /oauth2/**
          filters:
            - StripPrefix=0
        - id: calendars-service
          uri: lb://CALENDARS-SERVICE
          predicates:
            - Path=/calendars/**, /events/**, /attachments/**, /conference/**, /auth/**, /event/location/**, /api/tasks/**, /api/users/login/**, /zoom/**, subtasks/**, /notes/**, /members/**
          filters:
            - StripPrefix=0

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL}
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    hostname: ${GATEWAY_HOSTNAME}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

app:
  frontend:
    url: ${FRONTEND_URL}
  jwt:
    secret: ${JWT_SECRET}

server:
  port: ${GATEWAY_PORT}
