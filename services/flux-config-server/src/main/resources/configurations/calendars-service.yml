spring:
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
      resolve-lazily: true

  datasource:
    url: ${CALENDAR_PGURL}
    username: ${CALENDAR_PGUSER}
    password: ${CALENDAR_PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 40        # tune based on your DB server
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    database: ${REDIS_DATABASE}
    timeout: ${REDIS_TIMEOUT}
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 5
        max-wait: 2000ms

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: redis

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-description: init
    baseline-version: 0
    url: ${CALENDAR_PGURL}
    user: ${CALENDAR_PGUSER}
    password: ${CALENDAR_PGPASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: calendar-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: "com.flux.calendar_service.kafka.UserEvent"
        spring.json.use.type.info.headers: true
        spring.json.type.mapping: "userEvent:com.flux.calendar_service.kafka.UserEvent, com.flux.user_management_service.kafka.UserEvent:com.flux.calendar_service.kafka.UserEvent"

google:
  calendar:
    enabled: ${GOOGLE_CALENDAR_ENABLED}
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    scope:
      - https://www.googleapis.com/auth/calendar
    application-name: ${GOOGLE_CALENDAR_APPLICATION_NAME:${GOOGLE_APPLICATION_NAME:Flux Calendar Sync}}
    calendar-id: ${GOOGLE_CALENDAR_ID}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  external-url: ${MINIO_EXTERNAL_URL}

zoom:
  client:
    id: ${ZOOM_CLIENT_ID}
    secret: ${ZOOM_CLIENT_SECRET}
    redirect-uri: ${ZOOM_REDIRECT_URI}
  api:
    base-url: ${ZOOM_API_BASE_URL}
    token-url: ${ZOOM_TOKEN_URL}
    auth-url: ${ZOOM_AUTH_URL}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL}

server:
  port: ${CALENDARS_PORT}
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    connection-timeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET}
  url: ${APP_JWT_URL}
  share_url: ${FRONTEND_URL}

user-management-service:
  url: http://user-management-service:8081
