spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:calendar_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  task:
    scheduling:
      enabled: false

google:
  calendar:
    enabled: true
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost/auth/google/callback
    application-name: Flux Calendar Test

minio:
  endpoint: http://localhost:9000
  access-key: test-access
  secret-key: test-secret
  bucket: test-bucket
